services:
  db:
    image: mysql:8.0
    container_name: bbanggu-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"  # 로컬 개발용 — 외부 노출 안 함
    volumes:
      - ./backend/bbanggu/mysql/:/docker-entrypoint-initdb.d/
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bbanggu-network

  app:
    build:
      context: ./backend/bbanggu/
      dockerfile: Dockerfile
    image: bbanggu-server
    container_name: bbanggu-server
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"  # 직접 접근은 로컬 디버깅용 — 외부는 web(nginx) 경유
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://bbanggu-db:3306/${DB_NAME}?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SERVER_PORT=8081
      - UPLOAD_DIR=/app/uploads
    env_file:
      - .env
    volumes:
      - uploads_data:/app/uploads
    networks:
      - bbanggu-network
    restart: always

  ai:
    build:
      context: ./bbanggu_ai
      dockerfile: Dockerfile
    image: bbanggu-ai
    container_name: bbanggu-ai
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # /detect가 가게 빵 목록을 백엔드에서 조회 — 컨테이너 네트워크 안에서는 서비스명으로 접근
      - SPRING_SERVER_URL=http://bbanggu-server:8081
    depends_on:
      - app
    networks:
      - bbanggu-network
    restart: unless-stopped

  web:
    build:
      context: ./frontend/BBANGGU
      dockerfile: Dockerfile
      args:
        - VITE_KAKAO_MAP_API_KEY=${VITE_KAKAO_MAP_API_KEY}
    image: bbanggu-web
    container_name: bbanggu-web
    ports:
      - "80:80"
      # 443은 도메인/인증서 확정 후 개방
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/var/www/uploads:ro
    depends_on:
      - app
      - ai
    networks:
      - bbanggu-network
    restart: always

volumes:
  mysql_data:
  uploads_data:

networks:
  bbanggu-network:
    driver: bridge
