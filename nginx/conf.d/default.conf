# BBANGGU 리버스 프록시 — web 컨테이너(nginx:alpine)의 /etc/nginx/conf.d/default.conf 로 마운트됨
# HTTPS: certbot(Let's Encrypt) 인증서. DOMAIN_PLACEHOLDER 는 deploy/enable-https.sh 가 치환.

server {
    listen 80;
    server_name _;

    # ACME(Let's Encrypt) 갱신 챌린지는 HTTP로 받아야 함
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 그 외 모든 HTTP 요청은 HTTPS 정식 도메인으로 영구 이동
    # ($host 대신 도메인 고정 — IP로 온 요청을 IP HTTPS로 보내면 인증서 불일치 에러가 남)
    location / {
        return 301 https://DOMAIN_PLACEHOLDER$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name DOMAIN_PLACEHOLDER;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10m;  # 이미지 업로드 (백엔드 max-file-size와 일치)

    # 프론트 SPA 정적 파일
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 백엔드 API — /api 프리픽스 제거 후 전달 (프론트는 VITE_API_BASE_URL=/api 로 빌드됨)
    location /api/ {
        proxy_pass http://bbanggu-server:8081/;
        # 백엔드가 path=/auth/token/refresh 로 내리는 refreshToken 쿠키를 브라우저 경로(/api/...)에 맞게 변환
        # (이거 없으면 브라우저가 refresh 요청에 쿠키를 안 실어 재발급이 항상 401 — access 7일 시절엔 안 드러났던 잠복 버그)
        proxy_cookie_path /auth/token/refresh /api/auth/token/refresh;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    # AI 서버 — /ai 프리픽스 제거 후 전달 (FastAPI 라우트는 루트에 있음)
    location /ai/ {
        proxy_pass http://bbanggu-ai:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300;  # EfficientNet 추론이 수 초 걸릴 수 있음
        client_max_body_size 20m;
    }

    # 업로드 이미지 — 백엔드와 공유하는 도커 볼륨에서 직접 서빙
    location /uploads/ {
        alias /var/www/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }
}
