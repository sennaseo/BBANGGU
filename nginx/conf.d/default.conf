# BBANGGU 리버스 프록시 — web 컨테이너(nginx:alpine)의 /etc/nginx/conf.d/default.conf 로 마운트됨
# HTTPS는 도메인 확정 후 certbot 단계에서 추가 (지금은 HTTP만)

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;  # 이미지 업로드 (백엔드 max-file-size와 일치)

    # 프론트 SPA 정적 파일
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 백엔드 API — /api 프리픽스 제거 후 전달 (프론트는 VITE_API_BASE_URL=/api 로 빌드됨)
    location /api/ {
        proxy_pass http://bbanggu-server:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    # AI 서버 — /ai 프리픽스 제거 후 전달 (FastAPI 라우트는 루트에 있음)
    location /ai/ {
        proxy_pass http://bbanggu-ai:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300;  # EfficientNet 추론이 수 초 걸릴 수 있음
        client_max_body_size 20m;
    }

    # 업로드 이미지 — 백엔드와 공유하는 도커 볼륨에서 직접 서빙
    location /uploads/ {
        alias /var/www/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }
}
