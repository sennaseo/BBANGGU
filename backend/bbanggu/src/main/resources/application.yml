server:
  port: ${SERVER_PORT:8081}
  error:
    include-stacktrace: never
spring:
  autoconfigure:
    exclude: org.springframework.ai.autoconfigure.vectorstore.weaviate.WeaviateVectorStoreAutoConfiguration
  jackson:
    serialization:
      indent-output: true
    time-zone: Asia/Seoul
  config:
    import: optional:file:.env[.properties]
  application:
    name: bbanggu
  datasource:
    url: jdbc:mysql://localhost:3306/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  web:
    resources:
      static-locations: file:${UPLOAD_DIR:./uploads}/
  jpa:
    # database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true  # JPA 초기화 후 `data.sql` 실행
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: Asia/Seoul
    show-sql: true
    open-in-view: false
  #  sql:
  #    init:
  #      mode: always
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    protocol: smtp
  mvc:
    static-path-pattern: /uploads/**  # 업로드 이미지는 /uploads/** 로만 정적 서빙
    contentnegotiation:
      favor-parameter: false
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o
          temperature: 0.6

logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO

kakao:
  api:
    key: ${REST_API_KEY}
    url: https://dapi.kakao.com/v2/local/search/address.json
  client-id: ${KAKAO_CLIENT_ID}
  redirect-uri: ${KAKAO_REDIRECT_URI}
  front-base-url: ${FRONT_BASE_URL:http://localhost:5173}
  auth-uri: https://kauth.kakao.com/oauth/authorize
  api-url:
    token: https://kauth.kakao.com/oauth/token
    user-info: https://kapi.kakao.com/v2/user/me

jwt:
  secret:
    access: ${JWT_SECRET_ACCESS}
    refresh: ${JWT_SECRET_REFRESH}
  expiration:
    access-token: 1800000    # 30분 (밀리초) — AuthCookieFactory의 accessToken 쿠키 maxAge와 일치
    refresh-token: 604800000 # 7일 (밀리초) — refreshToken 쿠키 maxAge와 일치

toss:
  payments:
    api-key: ${TOSS_API_KEY}

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  # 쿠키 Secure 속성 — 운영(HTTPS)은 true, 로컬 HTTP 개발은 false 여야 Secure 쿠키가 저장됨
  cookie-secure: ${COOKIE_SECURE:false}



